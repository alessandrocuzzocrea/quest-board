services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: quest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:quest@db:5432/quest
      APP_SECRET: change-me-to-a-random-secret
    depends_on:
      db:
        condition: service_healthy
